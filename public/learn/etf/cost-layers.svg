<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="投入成本、持有费用和退出成本应分层核验">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#799cd6" stroke-width="1.5"/></marker></defs>
<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="40" y="54" font-size="32" fill="#203451" text-anchor="start">一项低年费，不代表完整低成本</text><rect x="40" y="115" width="260" height="230" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="170" y="169" font-size="36" fill="#203451" text-anchor="middle">进入</text><text x="170" y="235" font-size="28" fill="#526781" text-anchor="middle">申购 / 佣金</text><text x="170" y="287" font-size="28" fill="#526781" text-anchor="middle">价差 / 汇兑</text><rect x="350" y="115" width="260" height="230" rx="18" fill="#eaf1ff" stroke="#dce6f4" stroke-width="2"/><text x="480" y="169" font-size="36" fill="#315fd7" text-anchor="middle">持有</text><text x="480" y="235" font-size="28" fill="#526781" text-anchor="middle">管理 / 托管</text><text x="480" y="287" font-size="28" fill="#526781" text-anchor="middle">销售服务等</text><rect x="660" y="115" width="260" height="230" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="790" y="169" font-size="36" fill="#203451" text-anchor="middle">退出</text><text x="790" y="235" font-size="28" fill="#526781" text-anchor="middle">赎回 / 卖出</text><text x="790" y="287" font-size="28" fill="#526781" text-anchor="middle">转出 / 汇兑</text><path d="M308 230 L338 230" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><path d="M618 230 L648 230" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="416" font-size="28" fill="#647992" text-anchor="middle">实际收费以产品、账户和渠道规则为准</text></g></svg>
