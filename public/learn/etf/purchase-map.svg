<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="44" y="54" font-size="32" fill="#203451" text-anchor="start">同一目标 · 不同权益与执行</text><rect x="40" y="175" width="180" height="110" rx="18" fill="#e8efff" stroke="#dce6f4" stroke-width="2"/><text x="130" y="218" font-size="32" fill="#254775" text-anchor="middle">指数目标</text><text x="130" y="257" font-size="24" fill="#647992" text-anchor="middle">纳指 / 标普</text><path d="M226 230 L297 230" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><rect x="330" y="85" width="270" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="465" y="128" font-size="32" fill="#254775" text-anchor="middle">海外券商</text><text x="465" y="167" font-size="24" fill="#647992" text-anchor="middle">美国上市ETF</text><rect x="625" y="85" width="270" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="760" y="128" font-size="32" fill="#254775" text-anchor="middle">国内证券账户</text><text x="760" y="167" font-size="24" fill="#647992" text-anchor="middle">场内基金份额</text><rect x="330" y="250" width="270" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="465" y="293" font-size="32" fill="#254775" text-anchor="middle">基金销售渠道</text><text x="465" y="332" font-size="24" fill="#647992" text-anchor="middle">场外基金份额</text><rect x="625" y="250" width="270" height="110" rx="18" fill="#eef0ff" stroke="#dce6f4" stroke-width="2"/><text x="760" y="293" font-size="32" fill="#254775" text-anchor="middle">合资格交易平台</text><text x="760" y="332" font-size="24" fill="#647992" text-anchor="middle">代币化权益</text><text x="480" y="448" font-size="26" fill="#647992" text-anchor="middle">先核验资格、产品结构、费用与退出</text></g></svg>
